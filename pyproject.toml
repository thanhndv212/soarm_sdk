[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "soarm-sdk"
version = "0.1.0"
description = "Python SDK for SO-ARM type manipulators using Feetech STS/SCS series motors"
readme = "README.md"
authors = [
    { name = "Thanh Nguyen" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "streamlit>=1.38",
]

[project.optional-dependencies]
viser = [
    "viser>=1.0.0",
    "yourdfpy>=0.0.53",
    "trimesh>=3.21",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["soarm", "feetech", "sts", "scs", "robotics", "manipulator", "sdk"]

[project.urls]
Homepage = "https://github.com/thanhndv212/fullstack-manip"
Documentation = "https://github.com/thanhndv212/fullstack-manip/tree/main/soarm-sdk/docs"
Source = "https://github.com/thanhndv212/fullstack-manip"

[tool.hatch.build.targets.wheel]
packages = ["src/soarm_sdk"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.2",
]

[tool.hatch.envs.lint]
dependencies = [
    "ruff>=0.6",
]
[tool.hatch.envs.lint.scripts]
check = "ruff check src"
