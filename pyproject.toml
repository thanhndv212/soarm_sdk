[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "soarm-sdk"
version = "0.4.0"
description = "Python SDK for SO-ARM type manipulators using Feetech STS/SCS series motors"
readme = "README.md"
authors = [
    { name = "Thanh Nguyen" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["soarm", "feetech", "sts", "scs", "robotics", "manipulator", "sdk"]

[project.optional-dependencies]
viser = [
    "viser>=1.0.0",
    "yourdfpy>=0.0.53",
    "trimesh>=3.21",
]
# LeRobotRobot drives the same servo bus through lerobot's SOFollower
# instead of this SDK's own protocol stack. Optional: nothing else in the
# package imports lerobot, and the import is deferred to connect().
lerobot = [
    "lerobot>=0.1.0",
]
# Only RerunSink needs this, and it defers the import to construction, so the
# package works fine without it.
telemetry = [
    "rerun-sdk>=0.18",
]

[project.scripts]
soarm-calibrate = "soarm_sdk.cli.calibrate:main"
soarm-dashboard = "soarm_sdk.cli.dashboard:main"
soarm-dashboard-setup = "soarm_sdk.cli.dashboard:main_setup"
soarm-dashboard-calibration = "soarm_sdk.cli.dashboard:main_calibration"
soarm-seed-calibration = "soarm_sdk.calibration.seed:main"
soarm-calibrate-rom = "soarm_sdk.calibration.sweep_cli:main"

[project.urls]
Homepage = "https://github.com/thanhndv212/soarm_sdk"
Documentation = "https://github.com/thanhndv212/soarm_sdk/tree/main/docs"
Source = "https://github.com/thanhndv212/soarm_sdk"
Changelog = "https://github.com/thanhndv212/soarm_sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/soarm_sdk"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.2",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"

[tool.hatch.envs.lint]
dependencies = [
    "ruff>=0.6",
]
[tool.hatch.envs.lint.scripts]
check = "ruff check src tests"

[tool.ruff.lint]
# Pinned explicitly: with no [tool.ruff] section at all, ruff's own
# defaults have grown over versions well past the classic "E4, E7, E9, F"
# this project was set up against (CI's `ruff check src tests` was
# already failing on main with 466 findings from rule categories -
# UP, I, C4, PIE, RUF, S, B, DTZ, ... - nobody opted into; restoring the
# original minimal set here reflects what the codebase actually follows,
# rather than requiring a large, unrelated style rewrite to satisfy rules
# that were never intentionally enabled).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
