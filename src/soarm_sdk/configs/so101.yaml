# SO-101 robot configuration — consumed by soarm_sdk.robot.load_robot_config()
# and soarm_sdk.robot.servo.ServoRobot.
#
# The SO-101 is the revision physically present in this workspace. It shares
# the SO-100's servo layout and joint count; the limits below come from
# SO-ARM100/Simulation/SO101/so101_new_calib.urdf, which is the revision
# soarm_tamp and soarm_mjlab also reference. Prefer this config over
# soarm100.yaml for real-arm work.
#
# Trimmed to the fields this package's Robot/ServoRobot classes actually
# read. The upstream fullstack-manip version of this file also carries
# MuJoCo simulation and gripper-semantics blocks for its own MuJoCoRobot —
# not applicable here, so left out rather than shipped as unused/misleading
# config.

name: so101
description: "SO-101: 6-DOF Feetech STS3215 servo arm with 1-DOF jaw gripper"

# Order matches servo IDs 1-6.
n_dof: 6

# URDF joint names, in servo-ID order. Both so101_new_calib.urdf and
# so101_new_calib.urdf use these, as do lerobot, soarm_mjlab and soarm_tamp;
# the trailing comments are the servo/assembly labels this file used to
# carry, kept so the ID mapping is not lost.
joint_names:
  - shoulder_pan    # servo 1, "Rotation"
  - shoulder_lift   # servo 2, "Pitch"
  - elbow_flex      # servo 3, "Elbow"
  - wrist_flex      # servo 4, "Wrist_Pitch"
  - wrist_roll      # servo 5, "Wrist_Roll"
  - gripper         # servo 6, "Jaw"

# Joint limits in radians, in the URDF's kinematic frame, taken from
# SO-ARM100/Simulation/SO101/so101_new_calib.urdf.
#
# These were previously in mixed frames: shoulder_lift was offset by -pi/2
# and elbow_flex by +pi/2 relative to the URDF, while the other four joints
# matched it. Harmless while nothing read them, but ServoRobot enforces them
# on every write, so a planner commanding URDF-frame angles had 55% of a
# trajectory silently clamped at shoulder_lift. The joint travel is
# unchanged — only the zero these are measured from.
#
# Declared limits are a *model's* bound. When a RobotCalibration is supplied,
# ServoRobot enforces the intersection of these and the arm's measured
# travel, so the physical hard stops always win on the tight side.
joint_limits_lower: [-1.91986, -1.74533, -1.69000, -1.65806, -2.74385, -0.17453]
joint_limits_upper: [ 1.91986,  1.74533,  1.69000,  1.65806,  2.84121,  1.74533]

# Home position (radians), same URDF frame as the limits above. Every value
# sits inside the corrected limits. This is a folded rest pose, not the URDF
# zero (which is the arm straight out) — it has not been confirmed against
# the physical arm, so treat go_home() as unverified until it has been.
home_position: [0.0, -1.57, 1.57, 1.57, -1.57, 0.0]

# ── Gripper ───────────────────────────────────────────────────────────────
# Drives Robot.set_gripper()/toggle_gripper(). joint_index defaults to the
# last joint; stated explicitly here because the jaw being last is a
# property of this arm, not a rule.
gripper:
  joint_index: 5
  open_rad: 1.4
  closed_rad: 0.0

# ── Hardware (STS3215 servos) ─────────────────────────────────────────────
hardware:
  servo_ids: [1, 2, 3, 4, 5, 6]
  zero_offsets: [2048, 2048, 2048, 2048, 2048, 2048]
  # wrist_roll (5th) is -1, not +1: a physical direction-sign check on this
  # hardware (2026-09-12, arm thanh_arm) found it turning opposite the
  # URDF's convention while every other checked joint matched at +1. Kept in
  # sync with soarm_sdk.conversions.SOARM100_DIRECTION_SIGNS and
  # calibration.frame.DEFAULT_DIRECTION_SIGN_OVERRIDES.
  direction_signs: [1, 1, 1, 1, -1, 1]
  default_speed: 300   # ticks/s
  default_acc: 50      # acceleration units
  state_freq: 100      # Hz — bus read loop
  baud: 1000000
